<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- Background -->
  <rect width="128" height="128" rx="20" fill="#E8DABA"/>
  
  <!-- Top left key -->
  <circle cx="18" cy="18" r="9" fill="none" stroke="#1E3B19" stroke-width="3"/>
  <line x1="24" y1="24" x2="40" y2="40" stroke="#1E3B19" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="37" y2="27" stroke="#1E3B19" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="37" x2="42" y2="32" stroke="#1E3B19" stroke-width="2" stroke-linecap="round"/>

  <!-- Scroll left curl -->
  <ellipse cx="30" cy="68" rx="9" ry="16" fill="none" stroke="#1E3B19" stroke-width="3"/>
  <ellipse cx="30" cy="68" rx="4" ry="9" fill="none" stroke="#1E3B19" stroke-width="2"/>
  
  <!-- Scroll body -->
  <rect x="30" y="52" width="68" height="32" rx="4" fill="#D4C5A0" stroke="#1E3B19" stroke-width="3"/>
  
  <!-- Scroll right curl -->
  <ellipse cx="98" cy="68" rx="9" ry="16" fill="none" stroke="#1E3B19" stroke-width="3"/>
  <ellipse cx="98" cy="68" rx="4" ry="9" fill="none" stroke="#1E3B19" stroke-width="2"/>
  
  <!-- Cipher symbols centered on scroll -->
  <text x="64" y="67" font-family="Courier New" font-size="11" font-weight="bold" fill="#1E3B19" text-anchor="middle">A→X</text>
  <text x="64" y="80" font-family="Courier New" font-size="11" font-weight="bold" fill="#1E3B19" text-anchor="middle">B→Y</text>

  <!-- Bottom right key (mirrored, moved away from scroll) -->
  <circle cx="110" cy="110" r="9" fill="none" stroke="#1E3B19" stroke-width="3"/>
  <line x1="104" y1="104" x2="88" y2="88" stroke="#1E3B19" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="91" y2="102" stroke="#1E3B19" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="85" y2="96" stroke="#1E3B19" stroke-width="2" stroke-linecap="round"/>
  
</svg>
